name: Build

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

permissions:
    contents: read

env:
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    REFERENCE_PROJECT: Spotitoast.Logic

jobs:
    detect-framework:
        runs-on: ubuntu-latest
        outputs:
            framework: ${{ steps.framework.outputs.framework }}
            dotnet-version: ${{ steps.framework.outputs.dotnet-version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Detect target framework and SDK version
              id: framework
              shell: pwsh
              run: |
                  [xml]$project = Get-Content "${{ env.REFERENCE_PROJECT }}/${{ env.REFERENCE_PROJECT }}.csproj"
                  $framework = $project.Project.PropertyGroup.TargetFramework | Select-Object -First 1
                  if ([string]::IsNullOrWhiteSpace($framework)) {
                    throw "Unable to determine TargetFramework from ${{ env.REFERENCE_PROJECT }}/${{ env.REFERENCE_PROJECT }}.csproj"
                  }

                  $match = [System.Text.RegularExpressions.Regex]::Match($framework, '^net(?<major>\d+)\.(?<minor>\d+)')
                  if (-not $match.Success) {
                    throw "Unable to derive .NET SDK version from TargetFramework '$framework'"
                  }

                  $dotnetVersion = "{0}.{1}.x" -f $match.Groups['major'].Value, $match.Groups['minor'].Value
                  "framework=$framework" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "dotnet-version=$dotnetVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    test:
        needs: detect-framework
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: ${{ needs.detect-framework.outputs.dotnet-version }}
                  dotnet-quality: "preview"
                  cache: true
                  cache-dependency-path: "**/*.csproj"

            - name: Restore
              run: dotnet restore Spotitoast.Logic.Tests/Spotitoast.Logic.Tests.csproj

            - name: Test
              run: dotnet test Spotitoast.Logic.Tests/Spotitoast.Logic.Tests.csproj --no-restore -c Release --logger trx --results-directory TestResults

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results
                  path: TestResults

    build:
        needs: detect-framework
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-server
                      os: ubuntu-latest
                      restore-target: Spotitoast.Linux.Server/Spotitoast.Linux.Server.csproj
                      publish-project: Spotitoast.Linux.Server/Spotitoast.Linux.Server.csproj
                      artifact-name: spotitoast-linux
                    - platform: linux-client
                      os: ubuntu-latest
                      restore-target: Spotitoast.Linux.Client/Spotitoast.Linux.Client.csproj
                      publish-project: Spotitoast.Linux.Client/Spotitoast.Linux.Client.csproj
                      artifact-name: spotitoast-linux-client
                    - platform: windows
                      os: windows-latest
                      restore-target: Spotitoast.sln
                      publish-project: Spotitoast/Spotitoast.csproj
                      artifact-name: spotitoast-windows
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: ${{ needs.detect-framework.outputs.dotnet-version }}
                  dotnet-quality: "preview"
                  cache: true
                  cache-dependency-path: "**/*.csproj"

            - name: Restore dependencies
              run: dotnet restore ${{ matrix.restore-target }}

            - name: Build
              run: dotnet build ${{ matrix.restore-target }} --no-restore -c Release

            - name: Publish
              run: dotnet publish ${{ matrix.publish-project }} --no-build -c Release -o publish/${{ matrix.platform }}

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}
                  path: publish/${{ matrix.platform }}
